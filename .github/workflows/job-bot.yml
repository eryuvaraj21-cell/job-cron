name: Job Auto-Apply Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:          # Manual trigger

jobs:
  apply:
    runs-on: self-hosted
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one cycle
        run: python -m src.run_once
        timeout-minutes: 20
